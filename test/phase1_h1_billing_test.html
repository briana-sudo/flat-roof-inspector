  'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
  'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',

  'virginia':'VA','washington':'WA','west virginia':'WV','wisconsin':'WI','wyoming':'WY',
  'district of columbia':'DC'
};
var US_STATE_ABBREVS = Object.keys(US_STATE_NAMES).map(function(k){return US_STATE_NAMES[k];});

function parseCSZ(input) {
  if (!input || typeof input !== 'string') return {city:'', state:'', zip:''};
  var s = input.trim();
  if (!s) return {city:'', state:'', zip:''};
  var zip = '';
  var zipMatch = s.match(/(\d{5}(?:-\d{4})?)\s*$/);
  if (zipMatch) {
    zip = zipMatch[1];
    s = s.substring(0, zipMatch.index).trim();
    if (s.charAt(s.length-1) === ',') s = s.substring(0, s.length-1).trim();
  }
  var state = '';
  var sLower = s.toLowerCase();
  var matchedName = null;
  var matchedLen = 0;
  Object.keys(US_STATE_NAMES).forEach(function(name){
    var idx = sLower.lastIndexOf(name);
    if (idx === -1) return;
    if (idx + name.length !== sLower.length) return;
    if (idx > 0) {
      var prev = sLower.charAt(idx-1);
      if (prev !== ' ' && prev !== ',') return;
    }
    if (name.length > matchedLen) { matchedName = name; matchedLen = name.length; }
  });
  if (matchedName) {
    state = US_STATE_NAMES[matchedName];
    s = s.substring(0, s.length - matchedName.length).trim();
    if (s.charAt(s.length-1) === ',') s = s.substring(0, s.length-1).trim();
  } else {
    var abbrevMatch = s.match(/(?:^|[\s,])([A-Za-z]{2})\s*$/);
    if (abbrevMatch) {
      var candidate = abbrevMatch[1].toUpperCase();
      if (US_STATE_ABBREVS.indexOf(candidate) !== -1) {
        state = candidate;
        s = s.substring(0, abbrevMatch.index).trim();
        if (s.charAt(s.length-1) === ',') s = s.substring(0, s.length-1).trim();
      }
    }
  }
  var city = s.trim();
  if (city.charAt(city.length-1) === ',') city = city.substring(0, city.length-1).trim();
  return {city: city, state: state, zip: zip};
}

  function addUpdate(col1based, val) {
    if (val === undefined || val === null || val === '') return;
    updates.push({col: col1based, value: val});
  }

    updates.push({col: col1based, value: val});

  addUpdate(11, v('f-client'));

  if (insClaimVal === 'yes') addUpdate(23, v('f-claimnum'));
  addAlwaysUpdate(47, 'Yes');
  addUpdate(53, folderLink);

  return updates;
}

var newResults = [];

function fmt(x) {
  if (x === null) return 'null';
  if (x === undefined) return 'undefined';
  if (typeof x === 'object') return JSON.stringify(x);
  return JSON.stringify(x);
}

function assertNew(scenario, label, actual, expected) {
  var pass = (actual === expected);
  newResults.push({scenario:scenario, label:label, expected:expected, actual:actual, pass:pass, kind:'eq'});
}
function assertNewContains(scenario, label, updates, expectedEntry) {
  var found = updates.find(function(u){ return u.col === expectedEntry.col && u.value === expectedEntry.value; });
  newResults.push({scenario:scenario, label:label, expected:'contains '+fmt(expectedEntry), actual:found?fmt(found):'not found', pass:!!found, kind:'contains'});
}
function assertNewNotContains(scenario, label, updates, colNum) {
  var found = updates.find(function(u){ return u.col === colNum; });
  newResults.push({scenario:scenario, label:label, expected:'no entry with col='+colNum, actual:found?fmt(found):'no entry', pass:!found, kind:'notcontains'});
}

// For OLD scenarios: we re-run the NEW assertion against the OLD output and classify:
//   - mode='regression': we EXPECTED the NEW assertion to fail (OLD shape produces wrong value).
//     -> correctly DETECTED if it failed, HARNESS BROKEN if it unexpectedly passed.
//   - mode='agree': we EXPECTED the NEW assertion to pass (OLD agrees with NEW for this slot).
//     -> AGREES if it passed, HARNESS BROKEN if it unexpectedly failed.
function assertOld(scenario, label, actual, newExpected, mode) {
  var passedAssertion = (actual === newExpected);
  // For 'regression' mode: a failed assertion is the CORRECT detection.
  // For 'agree' mode: a passed assertion is the CORRECT outcome.
  var correct = (mode === 'regression') ? !passedAssertion : passedAssertion;
  oldResults.push({scenario:scenario, label:label, mode:mode, expected:newExpected, actual:actual, correct:correct, kind:'eq'});
}

function esc(x){
  if (x === null) return '<em>null</em>';
  if (x === undefined) return '<em>undefined</em>';
  return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var newPass = newResults.filter(function(r){return r.pass;}).length;

var oldRegressions = oldResults.filter(function(r){return r.mode==='regression';});

var oldRegrTotal = oldRegressions.length;
var oldAgreeCorrect = oldAgrees.filter(function(r){return r.correct;}).length;

var allGood = (newPass === newTotal) && (oldRegrCorrect === oldRegrTotal) && (oldAgreeCorrect === oldAgreeTotal);

// Render NEW results grouped by scenario
function renderNew() {
  var container = document.getElementById('newResults');
  var scenarios = {};
  newResults.forEach(function(r){
    if (!scenarios[r.scenario]) scenarios[r.scenario] = [];
    scenarios[r.scenario].push(r);
  });
  Object.keys(scenarios).forEach(function(scn){
    var list = scenarios[scn];
    var passN = list.filter(function(r){return r.pass;}).length;
    var h3 = document.createElement('h3');
    h3.textContent = 'Scenario ' + scn + ' — ' + passN + ' / ' + list.length + ' PASS';
    container.appendChild(h3);
    var table = document.createElement('table');
    table.innerHTML = '<tr><th>#</th><th>Assertion</th><th>Expected</th><th>Actual</th><th>P/F</th></tr>';
    list.forEach(function(r, i){
      var tr = document.createElement('tr');
      tr.className = r.pass ? 'pass' : 'fail';
      tr.innerHTML = '<td>'+(i+1)+'</td>'
        + '<td>'+esc(r.label)+'</td>'
        + '<td class="res">'+esc(r.expected)+'</td>'
        + '<td class="res">'+esc(r.actual)+'</td>'
        + '<td class="pf '+(r.pass?'pass':'fail')+'">'+(r.pass?'PASS':'FAIL')+'</td>';
      table.appendChild(tr);
    });
    container.appendChild(table);
  });
}
renderNew();

// Render OLD results grouped by scenario
function renderOld() {
  var container = document.getElementById('oldResults');
  var scenarios = {};
  oldResults.forEach(function(r){
    if (!scenarios[r.scenario]) scenarios[r.scenario] = [];
    scenarios[r.scenario].push(r);
  });
  Object.keys(scenarios).forEach(function(scn){
    var list = scenarios[scn];
    var regr = list.filter(function(r){return r.mode==='regression';});
    var agree = list.filter(function(r){return r.mode==='agree';});
    var regrOK = regr.filter(function(r){return r.correct;}).length;
    var agreeOK = agree.filter(function(r){return r.correct;}).length;
    var h3 = document.createElement('h3');
    h3.textContent = 'Scenario ' + scn + ' — regression detect: ' + regrOK + ' / ' + regr.length + ' | agreement: ' + agreeOK + ' / ' + agree.length;
    container.appendChild(h3);
    var table = document.createElement('table');
    table.innerHTML = '<tr><th>#</th><th>Assertion</th><th>Mode</th><th>NEW expects</th><th>OLD actual</th><th>Outcome</th></tr>';
    list.forEach(function(r, i){
      var outcomeText, cls;
      if (r.mode === 'regression') {
        if (r.correct) { outcomeText = 'REGRESSION CORRECTLY DETECTED'; cls = 'detect'; }
        else { outcomeText = 'HARNESS BROKEN — OLD unexpectedly produced NEW value'; cls = 'miss'; }
      } else {
        if (r.correct) { outcomeText = 'AGREES (no regression in this slot)'; cls = 'agree'; }
        else { outcomeText = 'HARNESS BROKEN — OLD unexpectedly diverged from NEW'; cls = 'miss'; }
      }
      var tr = document.createElement('tr');
      tr.className = cls;
      tr.innerHTML = '<td>'+(i+1)+'</td>'
        + '<td>'+esc(r.label)+'</td>'
        + '<td><strong>'+r.mode+'</strong></td>'
        + '<td class="res">'+esc(r.expected)+'</td>'
        + '<td class="res">'+esc(r.actual)+'</td>'
        + '<td class="pf '+cls+'">'+outcomeText+'</td>';
      table.appendChild(tr);
    });
    container.appendChild(table);
  });
}
